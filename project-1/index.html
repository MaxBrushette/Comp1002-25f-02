<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Sony Walkman</title>
        <meta name="author" content="Max Brushette" />
        <meta name="description" content="The main page for Sony Walkman promotion." />
        <link rel="shortcut icon" href="images/MusicIcon.png" type="image/x-icon" />
        <link rel="stylesheet" href="css/styles.css" />
    </head>
    <body>
        <header>
            <nav>
                <ul>
                    <li><a href="index.html" title="The Home page">Home</a></li>
                    <li><a href="promo.html" title="Promotion Details">Promo Details</a></li>
                    <li><a href="about.html" title="About the Product">About the Sony Walkman</a></li>
                    <li><a href="support.html" title="Contact us!">Support</a></li>
                </ul>
            </nav>
            <h1>The Sony Walkman</h1>
        </header>
        <main>
            <section>
                <article>
                    <figure>
                        <img src="images/Walkman.jpg" height="200" alt="Sony Walkman" />
                    </figure>
                    <h2>Music on the Move</h2>
                    <p>What's so amazing about the Sony Walkman? Click "Promo Details" or "About the Sony Walkman" for more information!</p>
                </article>
            </section>
            <section>
                <h2>Your Music, Your Thoughts</h2>
                <form id="review" action="review-process-form.php" method="post">
                    <input type="hidden" name="form-sent" value="1" />
                    <fieldset>
                        <legend>Write Your Own Review!</legend>
                        <label for="fname">First Name</label>
                        <input type="text" name="fname" id="fname" required />
                        <br />
                        <label for="lname">Last Name</label>
                        <input type="text" name="lname" id="lname" required />
                        <p id="FormP">Stars</p>
                        <select id="stars" name="stars-amount" required>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                        </select>
                        <br />
                        <p id="FormP">Your Review</p>
                        <label for="ReviewText" name="review-text"></label>
                        <textarea id="reviewtext" name="review-text" required></textarea>
                        <br />
                        <button type="submit">Complete Review</button>
                        <button type="reset">Reset Review</button>
                    </fieldset>
                </form>
            </section>
        </main>
    </body>
</html>
